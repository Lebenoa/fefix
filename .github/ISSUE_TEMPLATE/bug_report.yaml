name: Bug Report
description: Create a report to help us improve
labels: C-bug
body:
  - type: markdown
    attributes:
      value: Thank you for filing a bug report! 🐛
  - type: textarea
    id: problem
    attributes:
      label: Summary
      description: >
        Please provide a short summary of the bug, along with any information
        you feel relevant to replicate the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      value: |
        <!-- Ideally provide a key sequence and/or asciinema.org recording. --> 

        I tried this:

        1. `fx`

        I expected this to happen:

        Instead, this happened:
  - type: textarea
    id: helix-log
    attributes:
      label: fefix log
      description: See `fx -h` for log file path. If you can reproduce the issue run `RUST_BACKTRACE=1 fx -vv` to generate a more detailed log file.
      value: |
        <details><summary>~/.cache/fefix/helix.log</summary>

        ```
        please provide a copy of `~/.cache/fefix/helix.log` here if possible, you may need to redact some of the lines
        ```

        </details>
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux / macOS / Windows
    validations:
      required: true
  - type: input
    id: terminal-emulator
    attributes:
      label: Terminal Emulator
      placeholder: wezterm 20220101-133340-7edc5b5a
    validations:
      required: true
  - type: input
    id: installation-method
    attributes:
      label: Installation Method
      description: >
        How you installed fefix - from a package manager like Homebrew or the
        AUR, built from source, downloaded a binary from the releases page, etc.
      placeholder: "source / brew / nixpkgs / flake / releases page"
    validations:
      required: true
  - type: input
    id: helix-version
    attributes:
      label: fefix Version
      description: >
        Helix version (`fx -V` if using a release, `git describe` if building
        from master).
        **Make sure that you are using a recent build of [fefix](https://github.com/Lebenoa/fefix)**
      placeholder: "fefix 25.07 (5eaa6d97)"
    validations:
      required: true
